spring:
  application:
    name: SpotAlert

  data:
    mongodb:
      uri: ${MONGO_URI}

  redis:
    host: ${SPRING_DATA_REDIS_HOST}
    port: ${SPRING_DATA_REDIS_PORT}
    timeout-ms: 5000

  mail:
    host: ${SMTP_HOST}
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          from: ${FROM_MAIL}

jwt:
  secret-key: ${JWT_SECRET}
  expiration: 86400000

server:
  port: ${PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator

  endpoint:
    health:
      show-details: always

osrm:
  base-url: ${OSRM_URL}
  profile: driving
  timeout-ms: 5000

spotalert:
  verification:
    url: ${VERIFICATION_URL}
